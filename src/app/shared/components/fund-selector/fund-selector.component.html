<section class="fund-selector-wrapper">
  <div class="container">
    <div class="fund-selector-content">
      <!-- Fund Selection Area -->
      <div class="fund-selection">
        <div class="inception-info-date">
          <span class="inception-date">Inception: {{ selectedFund ? (selectedFund.inception_date | date: 'dd MMM, y') : '' }}</span>
        </div>
        <div class="fund-main">
          <div class="fund-dropdown">
            <div class="dropdown fund-dropdown">
              <button type="button" class="fund-dropdown-trigger dropdown-toggle" data-bs-toggle="dropdown">
                Select fund&nbsp;&nbsp;<img src="./../../../../assets/icons1/CaretDown.png" height="14" alt="Select Fund">
              </button>
              <ul class="dropdown-menu">
                <li *ngFor="let fund of fundList" (click)="onFundSelect(fund)">
                  <a class="dropdown-item" href="#">{{ fund.name }}</a>
                </li>
              </ul>
            </div>
          </div>

          <h1 class="fund-title">{{ selectedFund ? selectedFund.name : 'No fund selected' }}</h1>
        </div>
      </div>
    </div>
  </div>
</section>
<header class="navbar-wrapper">
  <!-- Secondary Navigation Bar -->
  <div class="navbar-secondary">
    <div class="container padding-top44">
      <nav class="navbar-main-nav">
        <a routerLink="/dashboard" class="nav-link-main" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
          <img [src]="isActiveRoute('/dashboard') ? './../../../assets/icons1/SquaresFour-Fill.png' : './../../../assets/icons1/SquaresFour.png'" alt="Dashboard" width="24" height="24" class="nav-icon">
          <span>Dashboard</span>
        </a>
        <a routerLink="/portfolio" class="nav-link-main" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
          <img [src]="isActiveRoute('/portfolio') ? './../../../assets/icons1/ChartDonut-Fill.png' : './../../../assets/icons1/ChartDonut.png'" alt="Portfolio" width="24" height="24" class="nav-icon">
          <span>Portfolio</span>
        </a>
        <a routerLink="/documents" class="nav-link-main" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
          <img [src]="isActiveRoute('/documents') ? './../../../assets/icons1/Files-Fill.png' : './../../../assets/icons1/Files.png'" alt="Documents" width="24" height="24" class="nav-icon">
          <span>Documents</span>
        </a>
      </nav>
      <div class="dropdown fund-dropdown">
        <button type="button" class="fund-dropdown-trigger dropdown-toggle" data-bs-toggle="dropdown">
          {{ asOfDate ? 'As of ' + (asOfDate | date: 'MMMM dd, y') : 'Select Date' }}&nbsp;&nbsp;<img src="./../../../../assets/icons1/CaretDown.png" height="14" alt="Select Fund">
        </button>
        <ul class="dropdown-menu">
          <li *ngFor="let fund of dataDates" (click)="onDateChange(fund)">
            <a class="dropdown-item">{{ fund | date: 'MMMM dd, y' }}</a>
          </li>
        </ul>
      </div>
    </div>
  </div>

</header>
