<div class="pdf-viewer-modal-overlay" *ngIf="config?.isOpen" (click)="closePdf()">
  <div class="pdf-viewer-container" (click)="$event.stopPropagation()">
    
    <!-- Header with controls -->
    <div class="pdf-viewer-header">
      <div class="pdf-viewer-title">
        <h3>{{ config?.fileName || 'Document' }}</h3>
      </div>

      <div class="pdf-viewer-controls">
        <!-- Zoom Controls -->
        <div class="control-group">
          <button
            class="control-btn"
            title="Zoom Out"
            (click)="zoomOut()"
            [disabled]="zoomLevel <= 50">
            <span class="icon">−</span>
          </button>
          <span class="zoom-level">{{ zoomLevel }}%</span>
          <button
            class="control-btn"
            title="Zoom In"
            (click)="zoomIn()"
            [disabled]="zoomLevel >= 400">
            <span class="icon">+</span>
          </button>
          <button
            class="control-btn"
            title="Reset Zoom"
            (click)="resetZoom()">
            <span class="icon">✓</span>
          </button>
        </div>

        <!-- Download Button -->
        <button
          class="control-btn download-btn"
          title="Download PDF"
          (click)="downloadPdf()"
          [disabled]="!safePdfUrl || isLoading">
          <span class="icon">⬇</span>
        </button>

        <!-- Fullscreen Toggle -->
        <button
          class="control-btn fullscreen-btn"
          title="Toggle Fullscreen"
          (click)="toggleFullscreen()"
          [disabled]="!safePdfUrl || isLoading">
          <span class="icon">⛶</span>
        </button>

        <!-- Close Button -->
        <button
          class="control-btn close-btn"
          title="Close PDF"
          (click)="closePdf()">
          <span class="icon">✕</span>
        </button>
      </div>
    </div>


    <!-- PDF Viewer Content -->
    <div class="pdf-viewer-content" *ngIf="safePdfUrl && !pdfLoadError">
      <ngx-extended-pdf-viewer
        #pdfViewer
        [src]="safePdfUrl"
        [zoom]="zoomLevel"
        [showPrintButton]="false"
        [showDownloadButton]="false"
        [showToolbar]="false"
        [showBorders]="false"
        [showHandToolButton]="false"
        [showPropertiesButton]="false"
        [showRotateButton]="false"
        [showSidebarButton]="false"
        (onDocumentLoad)="onPdfLoaded()"
        (onError)="onPdfLoadError($event)">
      </ngx-extended-pdf-viewer>
    </div>

    <!-- No PDF Message -->
    <div class="pdf-viewer-empty" *ngIf="!safePdfUrl && !isLoading && !pdfLoadError">
      <p>No PDF loaded</p>
    </div>

  </div>
</div>

<!-- Styles for loading and error states -->
<style>
  .pdf-loading-indicator {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 400px;
    gap: 1rem;
  }

  .spinner {
    border: 4px solid rgba(0, 0, 0, 0.1);
    border-top: 4px solid #007bff;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .pdf-error-message {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.5rem;
    background-color: #f8d7da;
    border: 1px solid #f5c6cb;
    border-radius: 4px;
    margin: 1rem;
    color: #721c24;
  }

  .error-icon {
    font-size: 2rem;
    flex-shrink: 0;
  }

  .error-content {
    flex: 1;
  }

  .error-content h4 {
    margin: 0 0 0.5rem 0;
    color: #721c24;
  }

  .error-content p {
    margin: 0 0 0.5rem 0;
    font-size: 0.9rem;
  }

  .error-close-btn {
    padding: 0.4rem 0.8rem;
    background-color: #721c24;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .error-close-btn:hover {
    background-color: #5a161c;
  }

  .pdf-viewer-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 400px;
    color: #999;
    font-size: 1.2rem;
  }
</style>
