<section class="documents-display-section">
  <!-- View Toggle Controls -->
  <div class="view-toggle-controls" *ngIf="showViewToggle">

      class="view-toggle-btn" 
      [class.active]="viewMode === 'list'"
      (click)="toggleView('list')"

        <g clip-path="url(#clip0_506_136)">
          <path d="M9 6H20.25" [attr.stroke]="viewMode === 'list' ? '#122334' : '#122334'" stroke-width="1.125" stroke-linecap="round" stroke-linejoin="round"/>

          <path d="M3.75 12H5.25" [attr.stroke]="viewMode === 'list' ? '#122334' : '#122334'" stroke-width="1.125" stroke-linecap="round" stroke-linejoin="round"/>

        </g>
        <defs>
          <clipPath id="clip0_506_136">
            <rect width="24" height="24" fill="white"/>
          </clipPath>
        </defs>
      </svg>
    </button>
    
    <button 
      class="view-toggle-btn" 
      [class.active]="viewMode === 'grid'"
      (click)="toggleView('grid')"
      title="Grid View">

  <!-- Grid View -->
  <div class="documents-grid" *ngIf="viewMode === 'grid'">

        <div class="document-card-content">
          <div class="document-info">
            <h4 class="document-title">{{ doc.title }}</h4>
            <p class="document-date">Issued on {{ doc.date }}</p>
          </div>

              <span class="file-size">{{ doc.size }}</span>

  <!-- List View -->
  <div class="documents-list" *ngIf="viewMode === 'list'">
    <div class="list-header">
      <div class="list-column document-type-column">Document Type</div>
      <div class="list-column date-column">Date Issued</div>
      <div class="list-column file-size-column">File Size</div>
      <div class="list-column actions-column">Quick Actions</div>
    </div>

    <div class="list-row" *ngFor="let doc of displayedDocuments">
      <div class="list-column document-type-column">
        <span class="document-type-text">{{ doc.title }}</span>
      </div>
      
      <div class="list-column date-column">
        <span class="date-text">{{ doc.date }}</span>
      </div>
      
      <div class="list-column file-size-column">
        <div class="file-info-wrapper">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g clip-path="url(#clip0_pdf_list)">

              <path d="M4.125 9.625V3.4375C4.125 3.25516 4.19743 3.0803 4.32636 2.95136C4.4553 2.82243 4.63016 2.75 4.8125 2.75H13.0625L17.875 7.5625V9.625" stroke="black" stroke-width="1.03125" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M13.0625 2.75V7.5625H17.875" stroke="black" stroke-width="1.03125" stroke-linecap="round" stroke-linejoin="round"/>

                <rect width="22" height="22" fill="white"/>
              </clipPath>
            </defs>
          </svg>
          <span class="file-size-text">{{ doc.size }}</span>
        </div>
      </div>
      
      <div class="list-column actions-column">
        <div class="list-actions">
          <button class="list-action-btn" (click)="onView(doc)" title="View Document">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">

                <path d="M11 4.8125C4.125 4.8125 1.375 11 1.375 11C1.375 11 4.125 17.1875 11 17.1875C17.875 17.1875 20.625 11 20.625 11C20.625 11 17.875 4.8125 11 4.8125Z" stroke="white" stroke-width="1.03125" stroke-linecap="round" stroke-linejoin="round"/>

          <button class="list-action-btn" (click)="onDownload(doc)" title="Download Document">

              </defs>
            </svg>
          </button>
