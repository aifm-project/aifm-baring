<section class="documents-display-section">
  <!-- View Toggle Controls -->
  <div class="view-toggle-controls" *ngIf="showViewToggle">
    <button 
      class="view-toggle-btn" 
      [class.active]="viewMode === 'list'"
      (click)="toggleView('list')"
      title="List View">
      <img src="./../../../../assets/icons1/ListDashes.png" alt="listing view" height="24" height="24">
    </button>
    
    <button 
      class="view-toggle-btn" 
      [class.active]="viewMode === 'grid'"
      (click)="toggleView('grid')"
      title="Grid View">
      <img src="./../../../../assets/icons1/GridFour.png" alt="grid view" height="24" height="24">
    </button>
  </div>

  <!-- Grid View -->
  <div class="documents-grid" *ngIf="viewMode === 'grid'">
    <div class="document-card"  *ngFor="let doc of displayedDocuments" [style.background-image]="'url(' + getBackgrounUrl(doc.type) + ')'" >
 
        <div class="document-card-content">
          <div class="document-info">
            <h4 class="document-title">{{ doc.type }}</h4>
            <p class="document-date">Issued on {{ (doc.date | date:'dd MMMM, yyyy') }}</p>
          </div>

          <div class="document-footer">
            <div class="document-file-info">
              <img src="./../../../../assets/icons1/FilePdf-Light.png" alt="FilePdf Download" height="22" height="22">
              <span class="file-size">{{ doc.size }}</span>
            </div>

            <div class="document-actions">
              <button class="document-action" (click)="onView(doc)" title="View Document">
                <img src="./../../../../assets/icons1/Eye.png" alt="FilePdf View" height="22" height="22">
              </button>

              <button class="document-action" (click)="onDownloadDocument(doc)" title="Download Document">
                <img src="./../../../../assets/icons1/DownloadSimple.png" alt="DownloadSimple Download" height="22" height="22">
              </button>

              <!-- <button class="document-action" (click)="onAISummary(doc)" title="AI Summary">
                <img src="./../../../../assets/icons1/Sparkle.png" alt="AI Search" height="22" height="22">
              </button> -->
            </div>
          </div>
        </div>
    </div>
  </div>

  <!-- List View -->
  <div class="documents-list" *ngIf="viewMode === 'list'">
    <div class="list-header">
      <div class="list-column document-type-column">Document Type</div>
      <div class="list-column date-column">Date Issued</div>
      <div class="list-column file-size-column">File Size</div>
      <div class="list-column actions-column">Quick Actions</div>
    </div>

    <div class="list-row" *ngFor="let doc of displayedDocuments">
      <div class="list-column document-type-column">
        <span class="document-type-text">{{ doc.type }}</span>
      </div>
      
      <div class="list-column date-column">
        <span class="date-text">{{ doc.date | date:'dd MMMM, yyyy' }}</span>
      </div>
      
      <div class="list-column file-size-column">
        <div class="file-info-wrapper">
          <img src="./../../../../assets/icons1/FilePdf.png" alt="FilePdf Download" height="22" height="22">
          <span class="file-size-text">{{ doc.size }}</span>
        </div>
      </div>
      
      <div class="list-column actions-column">
        <div class="list-actions">
          <button class="list-action-btn" (click)="onView(doc)" title="View Document">
             <img src="./../../../../assets/icons1/Eye-Light.png" alt="FilePdf View" height="22" height="22">
          </button>

          <button class="list-action-btn" (click)="onDownloadDocument(doc)" title="Download Document">
             <img src="./../../../../assets/icons1/DownloadSimple-Light.png" alt="DownloadSimple Download" height="22" height="22">
          </button>

          <!-- <button class="list-action-btn" (click)="onAISummary(doc)" title="AI Summary">
            <img src="./../../../../assets/icons1/Sparkle-Light.png" alt="AI Search" height="22" height="22">
          </button> -->
        </div>
      </div>
    </div>
  </div>
</section>
