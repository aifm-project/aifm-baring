<div class="web-documents">
  <main class="documents-content">
    <div class="container">
      <!-- Documents Header -->
      <section class="documents-header">
        <div class="header-content">
          <h2 class="documents-title">Documents and Reports</h2>
          <p class="documents-subtitle">Access the latest statements, receipts, and reports that track your investments with clarity.</p>
        </div>

        <!-- Filters and Controls -->
        <div class="documents-controls">
          <div class="filter-group">
            <button class="filter-dropdown">
              <select class="form-select"  (change)="documentTypeChange($event.target)">
              <option value="ALL">SORT BY TOPIC</option>
              <option *ngFor="let sk of documentTypes" [value]="sk">{{sk}}</option>
            </select>
            </button>
            
            <button class="filter-dropdown">
              <!-- <span>DATE RANGE</span> -->
              <select class="form-select"  (change)="documentRangeChange($event.target)">
              <option value="cm">DATE RANGE</option>
              <option value="cm">Current Month</option>
              <option value="lm">Last Month</option>
              <option value="l3m">Last 3 Month</option>
              <option value="l6m">Last 6 Month</option>
              <option value="ty">This Year</option>
            </select>
            </button>
            
            <div class="search-wrapper">
              <input 
                type="text" 
                placeholder="SEARCH BY TITLE, TYPE OR DATE" 
                class="search-input"
                (input)="searchDocuments($event.target.value)"
              />
              <svg class="search-icon" width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M13.125 19.25C16.5077 19.25 19.25 16.5077 19.25 13.125C19.25 9.74226 16.5077 7 13.125 7C9.74226 7 7 9.74226 7 13.125C7 16.5077 9.74226 19.25 13.125 19.25Z" stroke="#122334" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M17.457 17.4551L21.0008 20.9989" stroke="#122334" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>
      </section>

      <!-- Documents Grid with View Toggle -->
      <app-documents-grid 
        [showViewToggle]="true"
        [documents]="documentList"
        [maxDocuments]="null">
      </app-documents-grid>
    </div>
  </main>
</div>
