<section class="latest-insights">
  <div class="insights-container">
    <!-- Header -->
    <div class="insights-header-section">
      <div class="header-left">
        <h3 class="insights-title">Latest Insights</h3>
        <img #infoIcon src="./../../../../assets/icons1/Info-Black.png" 
             [alt]="infoIconAlt" 
             width="22" height="22" 
             data-bs-toggle="tooltip" 
             data-bs-placement="auto" 
             [title]="infoIconTitle">
      </div>
      <div class="header-right">
        <app-dashboard-navigation-button (onClickChild)="onViewAllInsights()" [showWhiteHover]="true" label="All Insights"></app-dashboard-navigation-button>
      </div>
    </div>

    <!-- Insights Grid -->
    <div class="insights-grid-layout">
      <!-- Featured Card - Left -->
      <article class="featured-insight-card" (click)="onReadInsight('featured')">
        <div class="featured-card-image">
         <img *ngIf="firstExplore?.isImage" [src]="firstExplore?.images" [alt]="firstExplore.header" />
          <app-video-frame skFrameId='videoFrame'  *ngIf="!firstExplore?.isImage && firstExplore?.video" [videoUrl]="firstExplore?.video" ></app-video-frame>
          <!-- <div class="image-gradient-overlay"></div> -->
        </div>
        <!-- <div class="featured-card-overlay-content">
          <button class="video-watch-btn" *ngIf="!firstExplore?.isImage && firstExplore?.video" (click)="onReadInsight('video'); $event.stopPropagation()">
            <span class="play-triangle"></span>
            <span class="btn-text">Watch Video</span>
          </button>
        </div> -->
        <div class="featured-card-footer">
          <div class="card-meta-info">
            <span class="badge-category">{{firstExplore.section_name}}</span>
            <span class="meta-date">{{ firstExplore.created_at | date:'MMMM dd , yyyy, h:mm a' }}</span>
          </div>
          <h2 class="featured-card-heading">{{firstExplore.header}}</h2>
        </div>
      </article>

      <!-- Side Cards Container - Right -->
      <div class="side-insights-container">
        <!-- Side Card 1 -->
        <div class="row">
          <article class="side-insight-card col-6"  *ngFor="let sk of explorAllData;let skIndex=index"  (click)="onReadInsight('side-1')">
          <div class="side-card-image-container">
            <img *ngIf="sk?.isImage" [src]="sk?.images" [alt]="sk.header" />
          <app-video-frame skFrameId='videoFrame'  *ngIf="!sk?.isImage && sk?.video" [videoUrl]="sk?.video" ></app-video-frame>
            <!-- <div class="side-image-overlay"></div> -->
          </div>
          <div class="side-card-text-content">
            <div class="side-card-meta">
              <span class="badge-category">{{sk.section_name}}</span>
              <span class="meta-date">{{ sk.created_at | date:'MMMM dd , yyyy, h:mm a' }}</span>
            </div>
            <h3 class="side-card-heading">{{sk.header}}</h3>
          </div>
        </article>
        </div>
      </div>
    </div>
  </div>
</section>
