# Nginx configuration for aif-baring Angular application
# Place this file in /etc/nginx/sites-available/aif-baring
# Run: sudo ln -s /etc/nginx/sites-available/aif-baring /etc/nginx/sites-enabled/aif-baring
# Then: sudo systemctl restart nginx

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name staging-ext-bpepindia.aifmetrics.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging-ext-bpepindia.aifmetrics.com;

    # SSL configuration
    ssl_certificate /etc/ssl/certs/staging-ext-bpepindia.aifmetrics.com.crt;
    ssl_certificate_key /etc/ssl/private/staging-ext-bpepindia.aifmetrics.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;

    # Set root to your build output directory
    root /var/www/aif-baring/html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Client caching for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Prevent caching of index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Serve index.html for any request that doesn't match a file
    # This enables SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # IMPORTANT: Configure MIME types correctly
    types {
        text/html                           html htm;
        text/css                            css;
        application/javascript              js mjs;
        application/wasm                    wasm;
        image/png                           png;
        image/jpeg                          jpg jpeg;
        image/gif                           gif;
        image/svg+xml                       svg svgz;
        image/x-icon                        ico;
        font/woff                           woff;
        font/woff2                          woff2;
        font/ttf                            ttf;
        font/otf                            otf;
        font/eot                            eot;
        application/json                    json;
        application/xml                     xml;
    }
    default_type application/octet-stream;

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
    }
}
